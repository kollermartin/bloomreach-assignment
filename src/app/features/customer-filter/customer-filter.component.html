<!--TODO Adjust defer later-->
@defer (when filterEvents()) {
  @let events = filterEvents()?.events;

  @if (events) {
    <div class="customer-filter">
      <app-customer-filter-header (discardFilters)="discardFilters()" />
      <app-customer-filter-content
        [customerEvents]="events"
        [customerFilterForm]="customerFilterForm"
        [discardFiltersTrigger]="discardSignal()"
        (addStep)="addStep()"
        (removeStep)="removeStep($event)"
      />
    </div>
  } @else {
    <h1>No customer events available</h1>
  }
} @placeholder {
  Loading...
}

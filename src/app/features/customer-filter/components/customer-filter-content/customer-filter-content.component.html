<div class="steps-header">
  <span>{{ heading | uppercase }}</span>
  <button (click)="discardFilters.emit()">Discard filters</button>
</div>
<form [formGroup]="customerFilterForm()">
  <div class="steps" formArrayName="steps">
    @for (step of steps.controls; track step; let i = $index) {
      <app-customer-filter-step
        [stepForm]="step"
        [index]="i"
        [customerEvents]="customerEvents()"
        (removeStep)="removeStep.emit(i)"
        (copyStep)="copyStep.emit(i)"
      />
      <app-separator />
    }
    <button (click)="addStep.emit()">{{ addFunnelStepKey }}</button>
  </div>
</form>
<button>Apply filters</button>
